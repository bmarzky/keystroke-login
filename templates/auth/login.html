<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biometric System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='tutorial/guide.css') }}">
</head>
<body>
    <div class="message-container" id="toast-container">
        {% if error %}
            <div class="toast error-box" id="status-msg">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="toast success-box" id="status-msg">{{ success }}</div>
        {% endif %}
        <div id="js-error-msg"></div>
    </div>

    <div class="auth-wrapper">
        <h2 class="auth-title">Login</h2>
        
        <form id="loginForm" class="auth-form" action="{{ url_for('login') }}" method="POST" autocomplete="off" novalidate>
            <input type="text" id="username" name="username" placeholder="Username" required autofocus autocomplete="off" minlength="3" maxlength="50">
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                <span class="toggle-password" id="toggle-password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </span>
            </div>
            <input type="hidden" name="keystroke" id="keystrokeData">

            <button type="submit">Login</button>
        </form>

        <p class="page-note">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>

<script src="{{ url_for('static', filename='js/keystroke.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth-forms.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
<script src="{{ url_for('static', filename='tutorial/guide.js') }}"></script>
</body>
</html>
